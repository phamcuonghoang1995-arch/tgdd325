let mode='all', selected=null;
const money=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n/1000000)+' tr';
const pct=n=>((Number(n)||0)*100).toFixed(1)+'%';
function setMode(m){mode=m;document.querySelectorAll('.filters .btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}
function clearSearch(){document.getElementById('q').value='';render()}
function filtered(){let q=document.getElementById('q').value.toLowerCase().trim();let a=DATA.employees.filter(e=>!q||e.name.toLowerCase().includes(q)||String(e.user).includes(q));if(mode==='rank')a.sort((x,y)=>(x.revenueRank||999)-(y.revenueRank||999));if(mode==='eff')a.sort((x,y)=>(y.completion||0)-(x.completion||0));return a}
function render(){
let a=filtered(); if(selected&&!a.some(e=>e.name===selected.name))selected=null;
document.getElementById('summary').innerHTML=`<div class="card"><div class="label">Nhân viên</div><div class="value">${DATA.employees.length}</div></div><div class="card"><div class="label">Đang hiển thị</div><div class="value">${a.length}</div></div><div class="card"><div class="label">Tổng target</div><div class="value">${money(DATA.employees.reduce((s,e)=>s+Number(e.target||0),0))}</div></div><div class="card"><div class="label">Tổng lũy kế</div><div class="value">${money(DATA.employees.reduce((s,e)=>s+Number(e.revenue||0),0))}</div></div>`;
document.getElementById('empbody').innerHTML=a.length?a.map(e=>`<tr class="click" onclick='selectEmp(${JSON.stringify(e.name)})'><td class="rank">#${e.revenueRank||'-'}</td><td><b>${e.name}</b><div class="muted">${e.user||''}</div></td><td>${money(e.target)}</td><td class="money">${money(e.revenue)}</td><td class="pct">${pct(e.completion)}</td><td>${pct(e.forecast)}</td><td>${e.contestRank||'-'}</td><td>${pct(e.contestPct)}</td></tr>`).join(''):`<tr><td colspan="8" class="empty">Không tìm thấy nhân viên</td></tr>`;
renderProfile();renderGroups();
}
function selectEmp(name){selected=DATA.employees.find(e=>e.name===name);render()}
function renderProfile(){
if(!selected){document.getElementById('profile').innerHTML='';return}
document.getElementById('profile').innerHTML=`<div class="panel"><h2>👤 ${selected.name}</h2><div class="profile">
<div class="card"><div class="label">Mã nhân viên</div><div class="value">${selected.user||'-'}</div></div>
<div class="card"><div class="label">Lũy kế</div><div class="value">${money(selected.revenue)}</div></div>
<div class="card"><div class="label">% Hoàn thành</div><div class="value">${pct(selected.completion)}</div></div>
<div class="card"><div class="label">Hạng doanh thu</div><div class="value">#${selected.revenueRank||'-'}</div></div>
<div class="card"><div class="label">Hạng thi đua</div><div class="value">#${selected.contestRank||'-'}</div></div>
</div></div>`}
function groupCard(g){
let rows=g.rows.filter(r=>!selected||r.name===selected.name);
if(!rows.length)return '';
return `<div class="group"><h3>${g.name}</h3>${rows.map(r=>`<div class="gline"><span><b>${r.name}</b><br><span class="muted">Target ${money(r.target)} • Lũy kế ${money(r.revenue)}</span></span><b>${pct(r.completion)}</b></div><div class="progress"><div class="bar ${r.completion<.7?'warn':''}" style="width:${Math.min(100,(Number(r.completion)||0)*100)}%"></div></div>`).join('')}</div>`
}
function renderGroups(){
let all=[...DATA.ict,...DATA.service];
document.getElementById('groups').innerHTML=all.map(groupCard).join('')||'<div class="empty">Chưa có dữ liệu nhóm ngành hàng.</div>';
}
render();
</script>
